# Netlify serves the React app from frontend/dist and runs the Express API
# (backend/) as a single serverless function behind /api/*.
[build]
  command = "npm ci --prefix backend && npm ci --prefix frontend && npm run build --prefix frontend"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"
  # VITE_* vars must also be set in Netlify UI — they are inlined at build time.
  # Required for production: DB_*, ADMIN_SECRET, ADMIN_USER, ADMIN_PASSWORD,
  # CUSTOMER_DEFAULT_PASSWORD. Optional: GOOGLE_MAPS_API_KEY, VITE_GOOGLE_MAPS_API_KEY.

[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"
  # mysql2 uses dynamic requires; keep it external so the Lambda runtime loads it.
  external_node_modules = ["mysql2"]

[functions."api"]
  # Allow cold start + DB ensureSchema on first request.
  timeout = 26

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Client-side routes (react-router) must all serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
